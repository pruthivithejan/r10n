[project]
site_name = "r10n"
site_description = "Automate repetitive routines: contacts, fill PDFs, images, and email"
site_author = "Pruthivi Thejan"
site_url = "https://pruthivithejan.github.io/r10n/"
repo_url = "https://github.com/pruthivithejan/r10n"
repo_name = "pruthivithejan/r10n"
copyright = "Copyright &copy; 2026 r10n"

# Navigation - Home as page, Get Started as section with sub-pages
nav = [
    { "Home" = "index.md" },
    { "Get Started" = [
        "get-started/index.md",
        "get-started/run-on-terminal.md",
        "get-started/install-binary.md",
        "get-started/setup-locally.md",
    ]},
    { "Automations" = [
        "automations/index.md",
        "automations/contacts.md",
        "automations/fill-pdfs.md",
        "automations/images.md",
        "automations/email.md",
        "automations/colors.md",
        "automations/rename-files.md",
        "automations/validate-csv.md",
        "automations/markdown-to-pdf.md",
    ]},
]

[project.theme]
features = [
    "navigation.instant",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.sections",
    "navigation.indexes",
    "navigation.footer",
    "content.code.copy",
]

# Icons
[project.theme.icon]
custom = "docs/.icons"
repo = "fontawesome/brands/github"

# Light Mode (Default)
[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

# Dark Mode
[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.theme.font]
text = "Google Sans"
code = "JetBrains Mono"

[project.extra]
generator = false

# Footer social links
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pruthivithejan"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/pruthivithejan"
name = "X"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://lk.linkedin.com/in/pruthivithejan"
name = "LinkedIn"
