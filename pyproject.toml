[project]
name = "r10n"
version = "0.12.2"
description = "r10n (routine automation): Automates repetitive routines like emails, PDF filling, contacts, images, and more"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Pruthvi Thejan", email = "pruthivithejan@gmail.com" }
]
keywords = [
    "automation",
    "email",
    "pdf",
    "contacts",
    "vcf",
    "images",
    "routine",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pypdf>=6.20.1",
    "reportlab>=5.0.1",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "openpyxl>=3.1.5",
    "markdown>=3.10.3",
    "flask>=3.1.3",
    "pypdfium2>=5.14.0",
    "certifi>=2026.7.22",
]

[project.urls]
Homepage = "https://github.com/pruthivithejan/r10n"
Documentation = "https://pruthivithejan.github.io/r10n"
Repository = "https://github.com/pruthivithejan/r10n.git"
"Issue Tracker" = "https://github.com/pruthivithejan/r10n/issues"

[project.scripts]
r10n = "r10n_backend.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=r10n_backend",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.hatch.build]
artifacts = ["src/r10n_backend/configure/templates/*.html"]

[tool.hatch.build.targets.wheel]
packages = ["src/r10n_backend"]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "zensical>=0.0.67",
    "ty>=0.0.87",
    "black>=26.10.1",
    "lefthook>=2.2.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "pymdown-extensions>=12.2",
]
