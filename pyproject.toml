[project]
name = "r10n"
version = "0.10.0"
description = "r10n (routine automation): Automates repetitive routines like emails, PDF filling, contacts, images, and more"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Pruthvi Thejan", email = "pruthivithejan@gmail.com" }
]
keywords = [
    "automation",
    "email",
    "pdf",
    "contacts",
    "vcf",
    "images",
    "routine",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=2.0.0",
    "pypdf>=3.9.0",
    "reportlab>=4.0.0",
    "pillow>=12.1.1",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.0.0",
    "markdown>=3.10.1",
    "flask>=3.0.0",
    "pypdfium2>=4.0.0",
    "typer>=0.26.2",
    "click>=8.0.0",
    "certifi>=2024.8.30",
]

[project.urls]
Homepage = "https://github.com/pruthivithejan/r10n"
Documentation = "https://pruthivithejan.github.io/r10n"
Repository = "https://github.com/pruthivithejan/r10n.git"
"Issue Tracker" = "https://github.com/pruthivithejan/r10n/issues"

[project.scripts]
r10n = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "zensical>=0.0.8",
    "ty>=0.0.29",
    "black>=26.3.1",
    "lefthook>=2.0.15",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.12",
]
