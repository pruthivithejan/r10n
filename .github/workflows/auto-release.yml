name: Auto Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate and resolve version
        id: version
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = str(pyproject["project"]["version"])

          cli_content = Path("src/cli.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION\s*=\s*"([^"]+)"', cli_content, re.MULTILINE)
          if not match:
              raise SystemExit("Could not find VERSION in src/cli.py")

          cli_version = match.group(1)
          if cli_version != project_version:
              raise SystemExit(
                  "Version mismatch: "
                  f"pyproject.toml={project_version}, src/cli.py={cli_version}"
              )

          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/v"):
              tag = os.environ["GITHUB_REF_NAME"]
              if tag != f"v{project_version}":
                  raise SystemExit(
                      f"Git tag {tag} does not match pyproject.toml version {project_version}"
                  )
          else:
              tag = f"v{project_version}"

          output_file = Path(os.environ["GITHUB_OUTPUT"])
          with output_file.open("a", encoding="utf-8") as output:
              output.write(f"version={project_version}\n")
              output.write(f"tag={tag}\n")

  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            asset: r10n-linux-x86_64.tar.gz
            executable: dist/r10n/r10n
          - os: macos-14
            python: "3.11"
            asset: r10n-macos-arm64.tar.gz
            executable: dist/r10n/r10n
          - os: windows-latest
            python: "3.11"
            asset: r10n-windows-x86_64.exe
            executable: dist/r10n.exe

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --name r10n \
            --onedir \
            --paths . \
            --collect-all pypdfium2 \
            --collect-all PIL \
            --collect-data certifi \
            src/cli.py

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --name r10n `
            --onefile `
            --paths . `
            --collect-all pypdfium2 `
            --collect-all PIL `
            --collect-data certifi `
            src/cli.py

      - name: Package asset (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x "${{ matrix.executable }}"
          tar -C dist -czf "dist/${{ matrix.asset }}" r10n

      - name: Rename asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item "${{ matrix.executable }}" "dist/${{ matrix.asset }}"

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./${{ matrix.executable }} --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./dist/${{ matrix.asset }} --version

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: r10n-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum r10n-* > SHA256SUMS

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v5
        with:
          name: SHA256SUMS
          path: release-assets/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [prepare, checksums]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: Automated release for ${{ needs.prepare.outputs.tag }}.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            release-assets/r10n-*
            release-assets/SHA256SUMS

  smoke-test-install:
    name: Smoke Test curl Install
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v5

      - name: Install latest binary via install script
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..5}; do
            if curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh" | sh; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "curl install failed after retries" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Verify installed binary
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/r10n" --version
