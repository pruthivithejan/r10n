name: Auto Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "src/cli.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate and resolve version
        id: version
        shell: python
        run: |
          import re
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = str(pyproject["project"]["version"])

          cli_content = Path("src/cli.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION\s*=\s*"([^"]+)"', cli_content, re.MULTILINE)
          if not match:
              raise SystemExit("Could not find VERSION in src/cli.py")

          cli_version = match.group(1)
          if cli_version != project_version:
              raise SystemExit(
                  "Version mismatch: "
                  f"pyproject.toml={project_version}, src/cli.py={cli_version}"
              )

          tag = f"v{project_version}"
          output_file = Path(__import__("os").environ["GITHUB_OUTPUT"])
          with output_file.open("a", encoding="utf-8") as output:
              output.write(f"version={project_version}\n")
              output.write(f"tag={tag}\n")

  ensure-tag:
    name: Ensure Git Tag
    runs-on: ubuntu-latest
    needs: [prepare]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create and push tag if missing
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          existing_ref=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')
          if [ -n "${existing_ref}" ]; then
            if [ "${existing_ref}" = "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already exists on current commit"
              exit 0
            fi

            echo "Tag ${TAG} already exists on a different commit: ${existing_ref}" >&2
            echo "Bump project version in pyproject.toml and src/cli.py before releasing." >&2
            exit 1
          fi

          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "${TAG}"

  build:
    name: Build Release Artifacts
    needs: [ensure-tag]
    uses: ./.github/workflows/build-binaries.yml
    permissions:
      contents: read

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            release-assets/r10n-*
            release-assets/SHA256SUMS

  smoke-test-install:
    name: Smoke Test curl Install
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Install latest binary via install script
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..5}; do
            if curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh" | sh; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "curl install failed after retries" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Verify installed binary
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/r10n" --version
