name: Build Binaries

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build
        type: string
        required: true
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - "src/**"
      - "tests/**"
      - "scripts/build_native.py"
      - "pyproject.toml"
      - "uv.lock"
      - "install.sh"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime and test dependencies
        run: python -m pip install . pytest pytest-cov
      - name: Test the complete Python automation core
        run: python -m pytest

  build:
    name: ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: r10n-linux-x86_64.tar.gz
          - os: macos-14
            asset: r10n-macos-arm64.tar.gz
          - os: windows-latest
            asset: r10n-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pytest
      - name: Test Go shell and compile native executable
        run: |
          go test ./...
          go vet ./...
          go build -o dist/compile-check ./cmd/r10n
      - name: Test bridge, packaging and upgrade helpers
        run: python -m pytest -o addopts="" tests/test_backend.py tests/test_build_native.py tests/test_upgrade.py
      - name: Build native bundle and smoke test contacts outside checkout
        run: python scripts/build_native.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: r10n-*
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum r10n-* > SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: SHA256SUMS
          path: release-assets/SHA256SUMS
          if-no-files-found: error
