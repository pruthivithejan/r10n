name: Build Binaries

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            asset: r10n-linux-x86_64
            executable: dist/r10n
          - os: macos-14
            python: "3.11"
            asset: r10n-macos-arm64
            executable: dist/r10n
          - os: windows-latest
            python: "3.11"
            asset: r10n-windows-x86_64.exe
            executable: dist/r10n.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --name r10n \
            --onefile \
            --paths . \
            --collect-all pypdfium2 \
            --collect-all PIL \
            src/cli.py

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --name r10n `
            --onefile `
            --paths . `
            --collect-all pypdfium2 `
            --collect-all PIL `
            src/cli.py

      - name: Rename asset (Unix)
        if: runner.os != 'Windows'
        run: |
          mv "${{ matrix.executable }}" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Rename asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item "${{ matrix.executable }}" "dist/${{ matrix.asset }}"

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./dist/${{ matrix.asset }} --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./dist/${{ matrix.asset }} --version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          find release-assets -mindepth 2 -type f -exec mv {} release-assets/ \;
          find release-assets -mindepth 1 -type d -empty -delete

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum r10n-* > SHA256SUMS

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: release-assets/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, checksums]

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          find release-assets -mindepth 2 -type f -exec mv {} release-assets/ \;
          find release-assets -mindepth 1 -type d -empty -delete

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/r10n-*
            release-assets/SHA256SUMS
