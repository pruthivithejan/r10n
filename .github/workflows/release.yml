name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            asset: r10n-linux-x86_64
            executable: dist/r10n
          - os: macos-14
            python: "3.11"
            asset: r10n-macos-arm64
            executable: dist/r10n
          - os: windows-latest
            python: "3.11"
            asset: r10n-windows-x86_64.exe
            executable: dist/r10n.exe

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --name r10n \
            --onefile \
            --paths . \
            --collect-all pypdfium2 \
            --collect-all PIL \
            src/cli.py

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --name r10n `
            --onefile `
            --paths . `
            --collect-all pypdfium2 `
            --collect-all PIL `
            src/cli.py

      - name: Rename asset (Unix)
        if: runner.os != 'Windows'
        run: |
          mv "${{ matrix.executable }}" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Rename asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item "${{ matrix.executable }}" "dist/${{ matrix.asset }}"

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./dist/${{ matrix.asset }} --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./dist/${{ matrix.asset }} --version

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: r10n-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum r10n-* > SHA256SUMS

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v5
        with:
          name: SHA256SUMS
          path: release-assets/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: [build, checksums]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: release_tag
        shell: python
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          import os
          import tomllib

          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/v"):
            tag = os.environ["GITHUB_REF_NAME"]
          else:
            with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
            version = data["project"]["version"]
            tag = f"v{version}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            f.write(f"tag={tag}\n")

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            release-assets/r10n-*
            release-assets/SHA256SUMS

  smoke-test-install:
    name: Smoke Test curl Install
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Install latest binary via install script
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..5}; do
            if curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh" | sh; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "curl install failed after retries" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Verify installed binary
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/r10n" --version
