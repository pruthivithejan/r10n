<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>r10n - Certificate Field Picker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #16213e; padding: 12px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #0f3460; }
  header h1 { font-size: 18px; color: #00d4ff; }
  header .subtitle { font-size: 13px; color: #888; }
  .container { display: flex; flex: 1; overflow: hidden; }

  /* Left panel - PDF canvas */
  .canvas-panel { flex: 1; overflow: auto; position: relative; background: #111; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
  .canvas-wrapper { position: relative; cursor: crosshair; }
  .canvas-wrapper img { display: block; }
  .field-marker {
    position: absolute; transform: translate(-50%, -50%);
    width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff;
    cursor: grab; z-index: 10; transition: box-shadow 0.15s;
  }
  .field-marker:hover, .field-marker.active { box-shadow: 0 0 8px rgba(0,212,255,0.8); }
  .field-marker .label {
    position: absolute; left: 16px; top: -6px; background: rgba(0,0,0,0.8);
    padding: 2px 8px; border-radius: 3px; font-size: 11px; white-space: nowrap; color: #fff;
    pointer-events: none;
  }
  .field-preview {
    position: absolute; pointer-events: none; z-index: 8; white-space: nowrap;
    line-height: 1; transform: translateY(-82%);
    text-shadow: 0 0 2px rgba(255,255,255,0.85);
  }
  .field-width-guide {
    position: absolute; pointer-events: none; z-index: 7; height: 34px;
    border-left: 2px solid rgba(0,212,255,0.9);
    border-right: 2px solid rgba(0,212,255,0.9);
    border-top: 1px dashed rgba(0,212,255,0.75);
    border-bottom: 1px dashed rgba(0,212,255,0.75);
    transform: translateY(-75%); background: rgba(0,212,255,0.05);
  }

  /* Right panel - Controls */
  .controls-panel { width: 360px; background: #16213e; border-left: 1px solid #0f3460; display: flex; flex-direction: column; overflow-y: auto; }
  .section { padding: 16px; border-bottom: 1px solid #0f3460; }
  .section h3 { font-size: 13px; color: #00d4ff; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
  input, select { width: 100%; padding: 6px 10px; background: #1a1a2e; border: 1px solid #333; border-radius: 4px; color: #e0e0e0; font-size: 13px; margin-bottom: 8px; }
  input:focus, select:focus { outline: none; border-color: #00d4ff; }
  button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn-primary { background: #00d4ff; color: #000; }
  .btn-primary:hover { background: #00b8d4; }
  .btn-secondary { background: #333; color: #e0e0e0; }
  .btn-secondary:hover { background: #444; }
  .btn-danger { background: #e74c3c; color: #fff; }
  .btn-danger:hover { background: #c0392b; }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }

  /* Field list */
  .field-item { background: #1a1a2e; border: 1px solid #333; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
  .field-item.selected { border-color: #00d4ff; }
  .field-item .field-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .field-item .field-name { font-weight: 600; font-size: 14px; }
  .field-item .field-coords { font-size: 11px; color: #888; }
  .field-config { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .field-config label { font-size: 11px; }
  .field-config input, .field-config select { font-size: 12px; padding: 4px 6px; margin-bottom: 0; }

  /* Zoom controls */
  .zoom-controls { display: flex; align-items: center; gap: 8px; }
  .zoom-controls button { padding: 4px 10px; font-size: 16px; }
  .zoom-controls span { font-size: 12px; color: #888; min-width: 40px; text-align: center; }

  /* Status bar */
  .status-bar { background: #0f3460; padding: 6px 24px; font-size: 12px; color: #888; display: flex; justify-content: space-between; }

  /* Toast notification */
  .toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: #00d4ff; color: #000; padding: 10px 24px; border-radius: 6px; font-weight: 600; display: none; z-index: 100; }
  .toast.show { display: block; }

  /* Color input wrapper */
  .color-row { display: flex; gap: 6px; align-items: center; }
  .color-row input[type="number"] { width: 50px; }
  .color-row input[type="color"] { width: 32px; height: 28px; padding: 0; border: none; cursor: pointer; }

  /* Marker colors */
  .marker-color-0 { background: #e74c3c; }
  .marker-color-1 { background: #3498db; }
  .marker-color-2 { background: #2ecc71; }
  .marker-color-3 { background: #f39c12; }
  .marker-color-4 { background: #9b59b6; }
  .marker-color-5 { background: #1abc9c; }
  .marker-color-6 { background: #e67e22; }
  .marker-color-7 { background: #e91e63; }
</style>
</head>
<body>

<header>
  <h1>r10n</h1>
  <span class="subtitle">Certificate Field Picker</span>
  <div style="flex:1"></div>
  <div class="zoom-controls">
    <button class="btn-secondary" onclick="setZoom(zoom - 0.25)">-</button>
    <span id="zoomLevel">100%</span>
    <button class="btn-secondary" onclick="setZoom(zoom + 0.25)">+</button>
    <button class="btn-secondary" onclick="setZoom(1)">Reset</button>
  </div>
</header>

<div class="container">
  <div class="canvas-panel" id="canvasPanel">
    <div class="canvas-wrapper" id="canvasWrapper">
      <img id="templateImg" alt="PDF Template">
    </div>
  </div>

  <div class="controls-panel">
    <!-- Add Field -->
    <div class="section">
      <h3>Add Field</h3>
      <label>Field name</label>
      <div style="display:flex; gap:6px;">
        <select id="fieldSelect" style="flex:1;">
          <option value="">-- select or type --</option>
        </select>
        <input id="fieldCustom" placeholder="custom name" style="flex:1;">
      </div>
      <p style="font-size:11px; color:#666; margin-top:4px;">Select from CSV headers or type a custom name, then click on the template image.</p>
    </div>

    <!-- Global Settings -->
    <div class="section">
      <h3>Global Settings</h3>
      <label>Font Family</label>
      <select id="globalFont" onchange="renderFields(); renderMarkers()">
        <option value="Helvetica">Helvetica</option>
      </select>
      <label>Output Directory</label>
      <input id="outputDir" value="local/outputs/certificates">
    </div>

    <!-- Placed Fields -->
    <div class="section" style="flex:1;">
      <h3>Placed Fields</h3>
      <div id="fieldList"></div>
      <div id="noFields" style="color:#666; font-size:12px;">No fields placed yet. Select a field name and click on the template.</div>
    </div>

    <!-- Actions -->
    <div class="section">
      <div class="btn-row">
        <button class="btn-secondary" style="flex:1" onclick="previewConfig()">Preview</button>
        <button class="btn-primary" style="flex:1" onclick="saveConfig()">Save Config</button>
      </div>
    </div>
  </div>
</div>

<div class="status-bar">
  <span id="statusCoords">Click on the template to place a field</span>
  <span id="statusInfo">Loading...</span>
</div>

<div class="toast" id="toast"></div>

<script>
const state = {
  fields: {},          // { fieldName: { x_px, y_px, x_pt, y_pt, font_size, max_width, font_weight, alignment, color } }
  selectedField: null,
  templateInfo: null,
  samples: {},
  localFonts: [],
};
let zoom = 0.25;
let dragging = null;
let dragOffset = { x: 0, y: 0 };

// --- Init ---
async function init() {
  const [infoRes, headersRes, fontsRes, samplesRes, localFontsRes, configRes] = await Promise.all([
    fetch('/api/template-info'),
    fetch('/api/csv-headers'),
    fetch('/api/font-families'),
    fetch('/api/sample-data'),
    fetch('/api/local-fonts'),
    fetch('/api/current-config'),
  ]);
  state.templateInfo = await infoRes.json();
  const headers = await headersRes.json();
  const fonts = await fontsRes.json();
  state.samples = await samplesRes.json();
  state.localFonts = await localFontsRes.json();
  const currentConfig = await configRes.json();

  // Populate field select
  const sel = document.getElementById('fieldSelect');
  headers.forEach(h => {
    const opt = document.createElement('option');
    opt.value = h.toLowerCase();
    opt.textContent = h;
    sel.appendChild(opt);
  });

  // Populate font select
  const fontSel = document.getElementById('globalFont');
  fontSel.innerHTML = '';
  const fontFamilies = [...new Set([...fonts, ...state.localFonts.map(font => font.family)])];
  fontFamilies.sort((a, b) => a.localeCompare(b));
  fontFamilies.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f;
    opt.textContent = f;
    fontSel.appendChild(opt);
  });
  const configuredFont = currentConfig.font_family;
  fontSel.value = configuredFont && fontFamilies.includes(configuredFont)
    ? configuredFont
    : (fontFamilies.includes('Helvetica') ? 'Helvetica' : fontFamilies[0]);
  if (currentConfig.output_directory) {
    document.getElementById('outputDir').value = currentConfig.output_directory;
  }

  // Load template image
  const img = document.getElementById('templateImg');
  img.src = '/api/template-image';
  img.onload = () => {
    setZoom(zoom);
    for (const [name, config] of Object.entries(currentConfig.fields || {})) {
      const [x_px, y_px] = pdfToPixel(
        config.x, config.y,
        state.templateInfo.render_width_px, state.templateInfo.render_height_px,
        state.templateInfo.width_pt, state.templateInfo.height_pt,
      );
      state.fields[name] = {
        x_px, y_px,
        x_pt: config.x,
        y_pt: config.y,
        font_size: config.font_size ?? 24,
        max_width: config.max_width ?? null,
        font_weight: config.font_weight ?? 400,
        alignment: config.alignment ?? 'center',
        color: config.color ?? [0, 0, 0],
      };
    }
    renderFields();
    renderMarkers();
    document.getElementById('statusInfo').textContent =
      `PDF: ${state.templateInfo.width_pt.toFixed(0)} x ${state.templateInfo.height_pt.toFixed(0)} pt | Image: ${state.templateInfo.render_width_px} x ${state.templateInfo.render_height_px} px`;
  };
}

// --- Zoom ---
function setZoom(z) {
  zoom = Math.max(0.25, Math.min(4, z));
  const img = document.getElementById('templateImg');
  if (state.templateInfo) {
    img.style.width = `${state.templateInfo.render_width_px * zoom}px`;
    img.style.height = `${state.templateInfo.render_height_px * zoom}px`;
  }
  document.getElementById('zoomLevel').textContent = `${Math.round(zoom * 100)}%`;
  updateMarkerPositions();
}

// --- Click to place ---
document.getElementById('canvasWrapper').addEventListener('click', function(e) {
  if (e.target.closest('.field-marker')) return;
  if (dragging) return;

  const fieldName = document.getElementById('fieldSelect').value || document.getElementById('fieldCustom').value.trim().toLowerCase();
  if (!fieldName) {
    showToast('Select or type a field name first');
    return;
  }

  const rect = document.getElementById('templateImg').getBoundingClientRect();
  const x_px = (e.clientX - rect.left) / zoom;
  const y_px = (e.clientY - rect.top) / zoom;

  const info = state.templateInfo;
  const [x_pt, y_pt] = pixelToPdf(x_px, y_px, info.render_width_px, info.render_height_px, info.width_pt, info.height_pt);

  state.fields[fieldName] = {
    x_px, y_px, x_pt, y_pt,
    font_size: 24,
    max_width: null,
    font_weight: 400,
    alignment: 'center',
    color: [0, 0, 0],
  };

  // Clear selection inputs
  document.getElementById('fieldSelect').value = '';
  document.getElementById('fieldCustom').value = '';

  state.selectedField = fieldName;
  renderFields();
  renderMarkers();
});

function pixelToPdf(cx, cy, rw, rh, pw, ph) {
  const x = cx * (pw / rw);
  const y = ph - (cy * (ph / rh));
  return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
}

function pdfToPixel(px, py, rw, rh, pw, ph) {
  const cx = px * (rw / pw);
  const cy = (ph - py) * (rh / ph);
  return [cx, cy];
}

// --- Markers ---
function renderMarkers() {
  document.querySelectorAll('.field-marker, .field-preview, .field-width-guide').forEach(el => el.remove());
  const wrapper = document.getElementById('canvasWrapper');
  const colorClasses = 8;
  let idx = 0;

  for (const [name, f] of Object.entries(state.fields)) {
    const marker = document.createElement('div');
    marker.className = `field-marker marker-color-${idx % colorClasses}${name === state.selectedField ? ' active' : ''}`;
    marker.style.left = (f.x_px * zoom) + 'px';
    marker.style.top = (f.y_px * zoom) + 'px';
    marker.dataset.field = name;
    marker.innerHTML = `<span class="label">${name}</span>`;

    // Drag events
    marker.addEventListener('mousedown', startDrag);
    marker.addEventListener('click', (e) => {
      e.stopPropagation();
      state.selectedField = name;
      renderFields();
      renderMarkers();
    });

    wrapper.appendChild(marker);

    const scale = (state.templateInfo.render_width_px / state.templateInfo.width_pt) * zoom;
    if (f.max_width) {
      const guide = document.createElement('div');
      guide.className = 'field-width-guide';
      guide.style.left = (f.x_px * zoom) + 'px';
      guide.style.top = (f.y_px * zoom) + 'px';
      guide.style.width = (f.max_width * scale) + 'px';
      if (f.alignment === 'center') guide.style.transform = 'translate(-50%, -75%)';
      if (f.alignment === 'right') guide.style.transform = 'translate(-100%, -75%)';
      wrapper.appendChild(guide);
    }

    const preview = document.createElement('div');
    preview.className = 'field-preview';
    preview.textContent = f.preview_text || state.samples[name] || `${name} example`;
    preview.style.left = (f.x_px * zoom) + 'px';
    preview.style.top = (f.y_px * zoom) + 'px';
    preview.style.fontSize = (f.font_size * scale) + 'px';
    preview.style.fontWeight = f.font_weight;
    preview.style.fontFamily = document.getElementById('globalFont').value;
    preview.style.color = rgbToHex(f.color[0], f.color[1], f.color[2]);
    if (f.alignment === 'center') preview.style.transform = 'translate(-50%, -82%)';
    if (f.alignment === 'right') preview.style.transform = 'translate(-100%, -82%)';
    wrapper.appendChild(preview);
    if (f.max_width) {
      const targetWidth = f.max_width * scale;
      const naturalWidth = preview.getBoundingClientRect().width;
      if (naturalWidth > targetWidth) {
        const fittedSize = Math.max(6 * scale, f.font_size * scale * targetWidth / naturalWidth);
        preview.style.fontSize = fittedSize + 'px';
        preview.title = `Fitted from ${f.font_size}pt to approximately ${(fittedSize / scale).toFixed(1)}pt`;
      }
    }
    idx++;
  }
}

function updateMarkerPositions() {
  renderMarkers();
}

// --- Dragging ---
function startDrag(e) {
  e.preventDefault();
  e.stopPropagation();
  const name = e.currentTarget.dataset.field;
  dragging = name;
  state.selectedField = name;

  const field = state.fields[name];
  const rect = document.getElementById('templateImg').getBoundingClientRect();
  dragOffset.x = e.clientX / zoom - field.x_px;
  dragOffset.y = e.clientY / zoom - field.y_px;

  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
}

function onDrag(e) {
  if (!dragging) return;
  const rect = document.getElementById('templateImg').getBoundingClientRect();
  const x_px = (e.clientX - rect.left) / zoom;
  const y_px = (e.clientY - rect.top) / zoom;

  const field = state.fields[dragging];
  field.x_px = x_px;
  field.y_px = y_px;

  const info = state.templateInfo;
  [field.x_pt, field.y_pt] = pixelToPdf(x_px, y_px, info.render_width_px, info.render_height_px, info.width_pt, info.height_pt);

  const marker = document.querySelector(`.field-marker[data-field="${dragging}"]`);
  if (marker) {
    marker.style.left = (x_px * zoom) + 'px';
    marker.style.top = (y_px * zoom) + 'px';
  }

  document.getElementById('statusCoords').textContent = `${dragging}: (${field.x_pt}, ${field.y_pt}) pt`;
  renderFields();
}

function endDrag() {
  dragging = null;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
  renderMarkers();
}

// --- Field list ---
function renderFields() {
  const list = document.getElementById('fieldList');
  const noFields = document.getElementById('noFields');
  const names = Object.keys(state.fields);

  if (names.length === 0) {
    list.innerHTML = '';
    noFields.style.display = 'block';
    return;
  }
  noFields.style.display = 'none';

  list.innerHTML = names.map(name => {
    const f = state.fields[name];
    const selected = name === state.selectedField;
    const colorHex = rgbToHex(f.color[0], f.color[1], f.color[2]);
    return `
      <div class="field-item${selected ? ' selected' : ''}">
        <div class="field-header" onclick="selectField('${name}')">
          <span class="field-name">${name}</span>
          <button class="btn-danger" style="padding:2px 8px; font-size:11px;" onclick="event.stopPropagation(); removeField('${name}')">Remove</button>
        </div>
        <div class="field-coords">Position: (${f.x_pt}, ${f.y_pt}) pt</div>
        <div class="field-config">
          <div style="grid-column:1 / -1;">
            <label>Live Preview Text</label>
            <input type="text" value="${escapeHtml(f.preview_text || state.samples[name] || `${name} example`)}" oninput="updateField('${name}', 'preview_text', this.value)">
          </div>
          <div>
            <label>Font Size</label>
            <input type="number" value="${f.font_size}" min="6" max="120" oninput="updateField('${name}', 'font_size', +this.value)">
          </div>
          <div>
            <label>Max Width (pt)</label>
            <input type="number" value="${f.max_width ?? ''}" min="0" max="4000" step="1" placeholder="No limit" oninput="updateField('${name}', 'max_width', this.value ? +this.value : null)">
          </div>
          <div>
            <label>Weight</label>
            <select onchange="updateField('${name}', 'font_weight', +this.value)">
              ${weightOptions(f.font_weight)}
            </select>
          </div>
          <div>
            <label>Alignment</label>
            <select onchange="updateField('${name}', 'alignment', this.value)">
              <option value="left"${f.alignment === 'left' ? ' selected' : ''}>Left</option>
              <option value="center"${f.alignment === 'center' ? ' selected' : ''}>Center</option>
              <option value="right"${f.alignment === 'right' ? ' selected' : ''}>Right</option>
            </select>
          </div>
          <div>
            <label>Color</label>
            <div class="color-row">
              <input type="color" value="${colorHex}" onchange="updateFieldColor('${name}', this.value)">
              <span style="font-size:11px;">${f.color.join(', ')}</span>
            </div>
          </div>
        </div>
      </div>`;
  }).join('');
}

function selectField(name) {
  state.selectedField = name;
  renderFields();
  renderMarkers();
}

function removeField(name) {
  delete state.fields[name];
  if (state.selectedField === name) state.selectedField = null;
  renderFields();
  renderMarkers();
}

function updateField(name, prop, value) {
  if (state.fields[name]) {
    state.fields[name][prop] = value;
    renderMarkers();
  }
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

function weightOptions(selectedWeight) {
  const family = document.getElementById('globalFont').value;
  const available = state.localFonts
    .filter(font => font.family === family)
    .map(font => font.weight);
  const weights = [...new Set(available.length ? available : [400, 700])].sort((a, b) => a - b);
  const normalized = selectedWeight === 'bold' ? 700 : selectedWeight === 'normal' ? 400 : Number(selectedWeight || 400);
  return weights.map(weight => `<option value="${weight}"${weight === normalized ? ' selected' : ''}>${weight}</option>`).join('');
}

function selectedFontPath(weight) {
  const family = document.getElementById('globalFont').value;
  const matches = state.localFonts.filter(font => font.family === family);
  if (!matches.length) return null;
  return matches.reduce((best, font) =>
    Math.abs(font.weight - Number(weight)) < Math.abs(best.weight - Number(weight)) ? font : best
  ).path;
}

function updateFieldColor(name, hex) {
  if (state.fields[name]) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    state.fields[name].color = [r, g, b];
    renderFields();
    renderMarkers();
  }
}

function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

// --- Preview ---
async function previewConfig() {
  const names = Object.keys(state.fields);
  if (names.length === 0) { showToast('Place at least one field first'); return; }

  const fields = {};
  const sampleData = {};
  for (const [name, f] of Object.entries(state.fields)) {
    fields[name] = {
      x: f.x_pt, y: f.y_pt,
      font_size: f.font_size,
      max_width: f.max_width,
      font_weight: f.font_weight,
      font_path: selectedFontPath(f.font_weight),
      alignment: f.alignment,
      color: f.color,
    };
    sampleData[name] = name.charAt(0).toUpperCase() + name.slice(1) + ' Example';
  }

  showToast('Generating preview...');
  const res = await fetch('/api/preview', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      font_family: document.getElementById('globalFont').value,
      fields,
      sample_data: sampleData,
    }),
  });

  if (res.ok) {
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    document.getElementById('templateImg').src = url;
    showToast('Preview loaded! Click "Reset" in zoom to reload the original template.');
  } else {
    showToast('Preview failed');
  }
}

// --- Save ---
async function saveConfig() {
  const names = Object.keys(state.fields);
  if (names.length === 0) { showToast('Place at least one field first'); return; }

  const fields = {};
  for (const [name, f] of Object.entries(state.fields)) {
    fields[name] = {
      x: f.x_pt, y: f.y_pt,
      font_size: f.font_size,
      max_width: f.max_width,
      font_weight: f.font_weight,
      font_path: selectedFontPath(f.font_weight),
      alignment: f.alignment,
      color: f.color,
    };
  }

  const res = await fetch('/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      font_family: document.getElementById('globalFont').value,
      output_directory: document.getElementById('outputDir').value,
      fields,
    }),
  });

  if (res.ok) {
    const data = await res.json();
    showToast(`Config saved to ${data.saved}! You can close this window.`);
  } else {
    showToast('Save failed');
  }
}

// --- Toast ---
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// --- Keyboard ---
document.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (state.selectedField && !e.target.matches('input, select')) {
      removeField(state.selectedField);
    }
  }
});

// --- Mouse position status ---
document.getElementById('canvasWrapper').addEventListener('mousemove', (e) => {
  if (dragging) return;
  const rect = document.getElementById('templateImg').getBoundingClientRect();
  const x_px = (e.clientX - rect.left) / zoom;
  const y_px = (e.clientY - rect.top) / zoom;
  if (state.templateInfo) {
    const info = state.templateInfo;
    const [x_pt, y_pt] = pixelToPdf(x_px, y_px, info.render_width_px, info.render_height_px, info.width_pt, info.height_pt);
    document.getElementById('statusCoords').textContent = `Cursor: (${x_pt}, ${y_pt}) pt`;
  }
});

init();
</script>
</body>
</html>
